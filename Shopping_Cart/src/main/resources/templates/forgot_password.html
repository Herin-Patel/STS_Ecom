<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{base::layout(~{::section})}">

<head>
	<meta charset="ISO-8859-1">
	<title>
		Insert title here
	</title>
</head>

<body>
	<section>

		<div class="container mt-5 p-5">
			<!-- Here, mt-5 means margin top = 5 and p-5 means padding = 5 -->

			<div class="row">

				<!-- First Grid containing image -->
				<div class="col-md-6 p-5">
					<img alt="" src="img/ecom.png" width="100%" height="400px">
				</div>

				<!-- Seond Grid containing login -->
				<div class="col-md-6 mt-3 p-5">
					<div class="card shadow p-3 mb-5 bg-body-tertiary rounded">


						<div class="card-header">
							<p class="fs-4 text-center">
								Forgot Password
							</p>

							<!--<div th:if="${param.logout}" class="alert alert-success">
								Logout successfully
							</div>-->

							<th:block th:if="${session.successMssg}">
								<p class="text-success fw-bold text-center">
									[[${session.successMssg}]]
								</p>
								<th:block th:text="${@commonServiceImpl.removeSessionMessage()}"></th:block>
							</th:block>

							<th:block th:if="${session.errorMssg}">
								<p class="text-danger fw-bold text-center">
									[[${session.errorMssg}]]
								</p>
								<th:block th:text="${@commonServiceImpl.removeSessionMessage()}"></th:block>
							</th:block>

						</div>


						<div class="card-body">
							<form action="/forgot-password" method="post">
								<div class="mb-3">
									<label class="form-label">
										Email
									</label>
									<input class="form-control" name="email" type="email"
										placeholder="Enter your email">
								</div>
								<div class="text-center">
									<button type="submit" class="btn bg-primary text-white col-md-4">Send</button>
								</div>
							</form>
						</div>
					</div>
				</div>
			</div>
		</div>
		</div>

	</section>
</body>

</html>
