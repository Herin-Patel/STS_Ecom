<!DOCTYPE html>

<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{base::layout(~{::section})}">

<head>
	<meta charset="ISO-8859-1">
	<title>
		Insert title here
	</title>
</head>

<body>
	<section>
		<div class="container-fluid p-5 mt-5">
			<!-- Here p-5 means padding = 5 and mt-5 means margin-top = 5 -->
			<div class="row">
				<!-- First panel -->
				<div class="col-md-3">
					<div class="card card-sh">
						<div class="card-header text-center">
							<p class="fs-4">
								Add Category
							</p>
							<th:block th:if="${session.successMssg}">
								<p class="text-success fw-bold">
									[[${session.successMssg}]]
								</p>
								<th:block th:text="${@commonServiceImpl.removeSessionMessage()}"></th:block>
							</th:block>

							<th:block th:if="${session.errorMssg}">
								<p class="text-danger fw-bold">
									[[${session.errorMssg}]]
								</p>
								<th:block th:text="${@commonServiceImpl.removeSessionMessage()}"></th:block>
							</th:block>
						</div>
						<div class="card-body">
							<form action="/admin/saveCategory" method="post" enctype="multipart/form-data">
								<div class="mb-3">
									<label>
										Enter Category
									</label>
									<input type="text" class="form-control" name="name">
								</div>

								<div class="mb-3">
									<label>
										Status
									</label>

									<div class="form-check">
										<input class="form-check-input" type="radio" name="isActive" id="radioDefault1"
											value="true" checked>
										<label class="form-check-label" for="radioDefault1">
											Active
										</label>
									</div>
									<div class="form-check">
										<input class="form-check-input" type="radio" name="isActive" id="radioDefault2"
											value="false">
										<label class="form-check-label" for="radioDefault2">
											Inactive
										</label>
									</div>
								</div>

								<div class="mb-3">
									<label>
										Upload Image
									</label>
									<input type="file" name="file" class="form-control">
								</div>
								<button class="btn btn-primary col-md-12 mt-2">
									Save
								</button>

							</form>
						</div>
					</div>
				</div>

				<!-- Second panel -->
				<div class="col-md-8">
					<div class="card card-sh">
						<div class="card-header text-center fs-4">
							Category Details
						</div>
						<div class="card-body">
							<table class="table table-hover">
								<thead>
									<tr>
										<th scope="col">Sr No.</th>
										<th scope="col">Category</th>
										<th scope="col">Status</th>
										<th scope="col">Image</th>
										<th scope="col">Action</th>
									</tr>
								</thead>
								<tbody>
									<tr th:each="cat, cStat : ${categories}">
										<th scope="row">[[${cStat.count}]]</th>
										<td>[[${cat.name}]]</td>
										<!--<td>[[${cat.isActive}]]</td>-->
										<td>
											<span th:if="${cat.isActive}" class="text-success">Active</span>
											<span th:unless="${cat.isActive}" class="text-danger">Inactive</span>
										</td>
										<td><img th:src="@{'/img/category_img/'+${cat.imageName}}" width="50px"
												height="50px"></td>
										<td>
											<a th:href="@{'/admin/loadEditCategory/'+${cat.id}}"
												class="btn btn-primary btn-sm"><i
													class="fa-duotone fa-solid fa-pen-to-square fa-1x"
													style="--fa-secondary-color: rgb(0, 51, 114);"></i>Edit</a>
											<a th:href="@{'/admin/deleteCategory/'+${cat.id}}"
												class="btn btn-danger btn-sm"><i
													class="fa-duotone fa-solid fa-trash fa-1x"
													style="--fa-secondary-color: rgb(0, 51, 114);"></i>Delete</a>
										</td>
									</tr>
								</tbody>
							</table>


							<!-- Start Pagination -->

							<div class="row">
								<div class="col-md-4">
									Total Categories : [[${totalElements}]]
								</div>
								<div class="col-md-6">
									<th:block th:if="${categorySize}>0">
										<nav aria-label="Page navigation example">
											<ul class="pagination">
												<li class="page-item" th:classappend="${isFirst} ? 'disabled' : ''">
													<a class="page-link"
														th:href="@{'/admin/category?pageNumber='+${pageNumber-1}}">
														Previous
													</a>
												</li>

												<li class="page-item" th:each="i:${#numbers.sequence(1, totalPages)}"
													th:classappend="${pageNumber+1 == i} ? 'active' : ''">
													<a class="page-link"
														th:href="@{'/admin/category?pageNumber='+${i-1}}">
														[[${i}]]
													</a>
												</li>
												<li class="page-item" th:classappend="${isLast} ? 'disabled' : ''">
													<a class="page-link"
														th:href="@{'/admin/category?pageNumber='+${pageNumber+1}}">
														Next
													</a>
												</li>
											</ul>
										</nav>
									</th:block>
								</div>
							</div>


						</div>
					</div>
				</div>
			</div>
	</section>
</body>

</html>
