<!DOCTYPE html>

<html lang="en" xmlns:th="http://thymeleaf.org" th:replace="~{base::layout(~{::section})}">

<head>
	<meta charset="ISO-8859-1">
	<title>
		Insert title here
	</title>
</head>

<body>
	<section>
		<div class="container-fluid p-5 mt-5">
			<!-- Here p-5 means padding = 5 and mt-5 means margin-top = 5 -->
			<div class="row">
				<!-- First panel -->
				<div class="col-md-3">
					<div class="card card-sh">
						<div class="card-header text-center fs-4">
							Add Category
						</div>
						<div class="card-body">
							<form>
								<div class="mb-3">
									<label>
										Enter Category
									</label>
									<input type="text" class="form-control">
								</div>

								<div class="mb-3">
									<label>
										Status
									</label>

									<div class="form-check">
										<input class="form-check-input" type="radio" name="radioDefault"
											id="radioDefault1">
										<label class="form-check-label" for="radioDefault1">
											Default radio
										</label>
									</div>
									<div class="form-check">
										<input class="form-check-input" type="radio" name="radioDefault"
											id="radioDefault2" checked>
										<label class="form-check-label" for="radioDefault2">
											Default checked radio
										</label>

								<div class="mb-3">
									<label>
										Upload Image
									</label>
									<input type="file" class="form-control">
								</div>

							</form>
						</div>
					</div>
				</div>

				<!-- Second panel -->
				<div class="col-md-8">
					<div class="card card-sh">
						<div class="card-header text-center fs-4">
							Category Details
						</div>
						<div class="card-body">
							<table class="table table-hover">
								<thead>
									<tr>
										<th scope="col">Sr No.</th>
										<th scope="col">Category</th>
										<th scope="col">Image</th>
										<th scope="col">Action</th>
									</tr>
								</thead>
								<tbody>
									<tr>
										<th scope="row">1</th>
										<td>Mark</td>
										<td>Otto</td>
										<td>@mdo</td>
									</tr>
								</tbody>
							</table>
						</div>
					</div>
				</div>
			</div>
		</div>
	</section>
</body>

</html>
